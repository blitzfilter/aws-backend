[package]
name = "product-listing-service"
version = "0.1.0"
edition = "2024"

[dependencies]
listing-source-core = { workspace = true }
listing-source-service = { workspace = true }
fake = { workspace = true, optional = true }
async-trait = { workspace = true }
application = { workspace = true }
domain-primitives = { workspace = true }
embedding = { workspace = true }
fxrate-core = { workspace = true }
fxrate-service = { workspace = true }
indexmap = { workspace = true }

localization = { workspace = true }
money = { workspace = true }
notification-core = { workspace = true }
notification-service = { workspace = true }
product-listing-core = { workspace = true }
product-listing-normalization = { workspace = true }
search-filter-core = { workspace = true }

serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
user-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }

[dev-dependencies]
notification-core = { workspace = true }
party-core = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
default = []
test-data = ["fake", "product-listing-core/test-data", "search-filter-core/test-data"]
